name: Docker Hub - Viviana

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    # Runs every day at 8:00 AM Peru time
    - cron: '0 13 * * *'

  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push Backend FUT
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_VIVIANA }}
          password: ${{ secrets.DOCKERHUB_TOKEN_VIVIANA }}

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and push the image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile-viviana/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            vivianacubas/solicitante-crud:latest
            vivianacubas/solicitante-crud:2.0
            vivianacubas/solicitante-crud:${{ github.sha }}
