name: Docker Hub

on:
  push:
    branches:
      - main
      - develop # you can add more branches
  pull_request:
    branches:
      - main
      - develop # you can add more branches
  schedule:
    # Runs every day at 8:00 AM Peru time (UTC-5) → 1:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:  # Allows manual execution from the GitHub Actions UI

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_YOJANA }}   # 👈 Replace with the name of your SECRET
          password: ${{ secrets.DOCKERHUB_TOKEN_YOJANA }}      # 👈 Replace with the name of your SECRET

      # 3. Build and push with latest and SHA tags
      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile-jimena/Dockerfile   # 👈 Replace with the path to your Dockerfile folder
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_YOJANA }}/springboot-sqlserver:latest
            ${{ secrets.DOCKERHUB_USERNAME_YOJANA }}/springboot-sqlserver:${{ github.sha }}
          # 👆 Replace with the name of your SECRET
          # 👆 You can change the Docker image name; in this case it is "springboot-sqlserver"
